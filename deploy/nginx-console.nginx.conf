# Nginx Console — 反向代理示例（TLS 终止 + WebSocket）
#
# 将 console.example.com 替换为真实域名；证书路径按实际调整。
# 主服务器只监听 127.0.0.1:8787，绝不要直接暴露到公网。
#
# 注意：
# - 应用自身会发送 CSP / HSTS / X-Frame-Options 等安全头，代理不要覆盖。
# - /agent/ws 必须支持 WebSocket Upgrade，并放宽读写超时。
# - client_max_body_size 至少 1m（证书上传请求上限 1 MiB）。

upstream nginx_console {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    # Agent 出站长连接。Agent 通过公网域名连接 wss://console.example.com/agent/ws。
    location /agent/ws {
        proxy_pass http://nginx_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://nginx_console;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
